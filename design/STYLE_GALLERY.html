<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>侧笺 · 界面样式</title><style>
:root{color-scheme:light;--paper:#f7f7f3;--ink:#26382d;--muted:#67736a;--line:#dde3d9;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}body.dark{color-scheme:dark;--paper:#171c1a;--ink:#e4ebe3;--muted:#acb9ae;--line:#39473d;--card:#202823}main{max-width:1480px;margin:auto;padding:52px 48px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;margin-bottom:32px}h1{font-size:28px;letter-spacing:-1px;font-weight:600;line-height:1.3;margin:10px 0}p{color:var(--muted);margin:10px 0 0;font-size:13px}.controls{display:flex;gap:12px;flex-wrap:wrap}.group{display:flex;border:1px solid var(--line);padding:3px;gap:3px;border-radius:7px}button{font:inherit;color:inherit;cursor:pointer} .group button{background:transparent;border:0;border-radius:4px;padding:6px 12px;font-size:12px}.group button[aria-pressed=true]{background:var(--ink);color:var(--paper)}button:focus-visible{outline:2px solid #8faa88;outline-offset:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}.card{min-width:0;border:1px solid var(--line);background:var(--card);border-radius:12px;overflow:hidden}.card>button{display:block;width:100%;border:0;padding:0;background:var(--card)}.card img{display:block;width:100%;height:auto;aspect-ratio:1180/760;object-fit:contain}.grid.edge{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.grid.edge .caption{display:block;padding:16px}.grid.edge .caption span{display:block;margin-top:5px}.grid.edge img{aspect-ratio:1180/760;height:400px;padding:12px}.caption{padding:20px 24px;border-top:1px solid var(--line);display:flex;gap:18px;align-items:center}.caption b{font-weight:600;font-size:18px}.caption span{font-size:12px;color:var(--muted)}.note{margin-top:26px;font-size:12px}dialog{max-width:min(94vw,1400px);max-height:94vh;border:1px solid var(--line);background:var(--card);padding:12px;border-radius:10px;color:var(--ink)}dialog::backdrop{background:#101914a6}dialog img{max-width:100%;max-height:83vh;display:block;margin:auto;object-fit:contain}dialog button{float:right;background:transparent;border:0;padding:5px 12px;margin-bottom:6px}a{color:inherit}@media(max-width:1000px){.grid.edge{grid-template-columns:1fr 1fr}}@media(max-width:900px){main{padding:30px 20px}header{display:block}.controls{margin-top:24px}.grid{grid-template-columns:1fr}.caption{padding:16px}}
@media(max-width:540px){.grid.edge{grid-template-columns:1fr}}</style></head><body><main><header><div><h1>侧笺的四种界面</h1><p>对比控制台、小窗和设置页。点击截图可放大查看。</p></div><div class="controls"><div class="group" aria-label="明暗"><button data-theme="light" aria-pressed="true">浅色</button><button data-theme="dark" aria-pressed="false">深色</button></div><div class="group" aria-label="界面"><button data-view="console" aria-pressed="true">控制台</button><button data-view="edge-368x610" aria-pressed="false">边缘小窗</button><button data-view="settings" aria-pressed="false">风格选择</button></div></div></header><div class="grid" id="grid"></div><p class="note">点击截图放大。这里展示合成任务数据的真实浏览器界面；在 SideTask 的「设置 → 界面风格」中可以即时切换，并同步大小窗。截图不代表系统多屏验收。<a href="../docs/research/UI_REFERENCES.md">设计来源记录</a></p></main><dialog id="viewer"><button id="close" autofocus>关闭 ×</button><img id="full" alt="界面大图"></dialog><script>
const styles=[['paper','纸笺','纸白底色，舒展行距'],['studio','霜序','深色侧栏，分组列表'],['editorial','暖刊','暖色纸面，宋体标题'],['mono','极简','黑白界面，紧凑行距']];let theme='light',view='console';const grid=document.querySelector('#grid'),viewer=document.querySelector('#viewer');function render(){document.body.classList.toggle('dark',theme==='dark');grid.classList.toggle('edge',view.startsWith('edge'));grid.replaceChildren(...styles.map(([id,name,desc])=>{const card=document.createElement('article');card.className='card';const button=document.createElement('button');button.setAttribute('aria-label','放大'+name+'界面');const img=document.createElement('img');img.src='previews/styles/'+id+'-'+theme+'-'+view+'.png';img.alt=name+' '+(theme==='light'?'浅色':'深色')+' '+view;button.append(img);button.onclick=()=>{document.querySelector('#full').src=img.src;document.querySelector('#full').alt=img.alt;viewer.showModal()};const caption=document.createElement('div');caption.className='caption';const title=document.createElement('b');title.textContent=name;const text=document.createElement('span');text.textContent=desc;caption.append(title,text);card.append(button,caption);return card}));}document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});document.querySelector('#close').onclick=()=>viewer.close();render();
</script></body></html>
